name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Use your own signing key (if configured)
        env:
          KS_B64: ${{ secrets.LATCH_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "LATCH_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Signing with the repository's upload key"
          else
            echo "No LATCH_KEYSTORE_BASE64 secret: signing with the bundled test key"
          fi

      - name: Build release APK
        env:
          LATCH_KEYSTORE_PASSWORD: ${{ secrets.LATCH_KEYSTORE_PASSWORD }}
          LATCH_KEY_ALIAS: ${{ secrets.LATCH_KEY_ALIAS }}
          LATCH_KEY_PASSWORD: ${{ secrets.LATCH_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease bundleRelease testReleaseUnitTest --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report errors (1-10)
        if: failure()
        run: python3 .github/scripts/annotate.py 0
      - name: Report errors (11-20)
        if: failure()
        run: python3 .github/scripts/annotate.py 10
      - name: Report errors (21-30)
        if: failure()
        run: python3 .github/scripts/annotate.py 20

      - name: Collect outputs
        run: |
          cp app/build/outputs/apk/release/app-release.apk LatchScan.apk
          cp app/build/outputs/bundle/release/app-release.aab LatchScan.aab
          ls -la LatchScan.apk LatchScan.aab

      - name: Check 16 KB page-size support (Play Store requirement)
        run: |
          mkdir -p apk_libs && unzip -qo LatchScan.apk 'lib/*' -d apk_libs
          bad=0
          for so in apk_libs/lib/arm64-v8a/*.so; do
            align=$(readelf -lW "$so" | awk '$1=="LOAD"{print $NF}' | sort -u | tr '\n' ' ')
            ok=1
            for a in $align; do [ $((a)) -ge 16384 ] || ok=0; done
            if [ $ok = 1 ]; then echo "::notice::16KB OK $(basename $so) ($align)"; else echo "::warning::NOT 16KB aligned: $(basename $so) ($align)"; bad=1; fi
          done
          echo "bad=$bad"

      - uses: actions/upload-artifact@v4
        with:
          name: LatchScan
          path: |
            LatchScan.apk
            LatchScan.aab

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LatchScan.apk LatchScan.aab \
            --title "Latch Scan (build ${{ github.run_number }})" \
            --notes "Install: download LatchScan.apk on your Android phone and open it. LatchScan.aab is the bundle for the Play Console. Built from ${{ github.sha }}." \
            --latest

  device-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and test APKs (with x86_64 for the emulator)
        env:
          LATCH_EMULATOR_ABI: "true"
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        run: python3 .github/scripts/annotate.py 0

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated
          disable-animations: false
          script: bash .github/scripts/device-test.sh

      - name: Publish screenshots and logs to the ci-artifacts branch
        if: always()
        run: |
          [ -d out ] || exit 0
          cp -r out "$RUNNER_TEMP/out"
          git config user.name "latch-ci"
          git config user.email "latch-ci@users.noreply.github.com"
          git checkout --orphan ci-artifacts-tmp
          git rm -rfq . || true
          rm -rf ./*
          mkdir -p "run-${{ github.run_number }}"
          cp -r "$RUNNER_TEMP/out/." "run-${{ github.run_number }}/"
          rm -f "run-${{ github.run_number }}/logcat-full.txt"
          git add "run-${{ github.run_number }}"
          git commit -qm "CI device test output, run ${{ github.run_number }} (${{ github.sha }})"
          git push -f origin HEAD:ci-artifacts

      - name: Fail if instrumented tests failed
        run: |
          f="$RUNNER_TEMP/out/instrument.txt"
          grep -q "^OK (" "$f" || { echo "::error::Instrumented tests failed"; grep -E "FAILURES|Error|Exception|at com.mithun" "$f" | head -n 40; exit 1; }
          grep "^OK (" "$f"
