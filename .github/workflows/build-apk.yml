name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease testReleaseUnitTest --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Report errors (1-10)
        if: failure()
        run: python3 .github/scripts/annotate.py 0
      - name: Report errors (11-20)
        if: failure()
        run: python3 .github/scripts/annotate.py 10
      - name: Report errors (21-30)
        if: failure()
        run: python3 .github/scripts/annotate.py 20

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk LatchScan.apk

      - uses: actions/upload-artifact@v4
        with:
          name: LatchScan-apk
          path: LatchScan.apk

      - name: Publish "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest LatchScan.apk \
            --title "Latch Scan (build ${{ github.run_number }})" \
            --notes "Download LatchScan.apk below and open it on your Android phone. Built from ${{ github.sha }}." \
            --latest
